# LXR served under /lxr/  (single tree, virtroot /lxr, sources at /opt/lxr).
#
# Two LXR-behind-a-webserver subtleties are handled here:
#
# 1) SCRIPT_NAME must be exactly /lxr/<script> (not the full URL), or LXR reports
#    "No known root". fcgiwrap keeps the FIRST value of a duplicated FastCGI param,
#    so we make `include fastcgi_params`'s SCRIPT_NAME correct via
#    fastcgi_split_path_info instead of overriding it afterwards.
#
# 2) LXR bakes an ABSOLUTE base href built from lxr.conf's host_names + the
#    container port (e.g. //localhost:80/lxr/). That breaks the page when reached
#    on any other port (8080, a proxy, ...). We force a stable host identity so
#    LXR always (a) matches the tree regardless of how it was reached, and
#    (b) emits the same constant base href, which we then rewrite to a
#    host/port-relative "/lxr/" so the browser uses whatever it actually hit.

server {
    listen 80 default_server;
    server_name _;

    # Convenience: send the bare root to the source browser.
    location = / { return 302 /lxr/source; }

    # LXR CGI scripts (FastCGI via fcgiwrap).
    location ~ ^/lxr/(?<lxr_script>diff|ident|perf|search|showconfig|source)(?:/|$) {
        # Forced FIRST so they win fcgiwrap's first-duplicate rule.
        fastcgi_param HTTP_HOST      localhost;
        fastcgi_param SERVER_PORT    80;
        fastcgi_param REQUEST_SCHEME http;

        # Split into SCRIPT_NAME (=/lxr/<script>) and PATH_INFO (=the rest).
        fastcgi_split_path_info ^(/lxr/(?:diff|ident|perf|search|showconfig|source))(.*)$;
        include /etc/nginx/fastcgi_params;            # SCRIPT_NAME=$fastcgi_script_name=/lxr/<script>
        fastcgi_param SCRIPT_FILENAME /opt/lxr/$lxr_script;  # the script file (also $0 -> `use lib`)
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_pass  unix:/var/run/fcgiwrap.socket;
        gzip off;

        # Make LXR's absolute base href host/port-relative (text/html is the
        # default sub_filter type, so it is not redeclared).
        sub_filter_once on;
        sub_filter '//localhost:80/lxr/' '/lxr/';
    }

    # Everything else under /lxr/ is a static asset (CSS, icons):
    #   /lxr/templates/lxr.css -> /opt/lxr/templates/lxr.css
    location /lxr/ {
        alias /opt/lxr/;
    }
}
